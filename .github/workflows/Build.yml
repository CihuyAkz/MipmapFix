name: Build Fabric Mod

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Repo ini belum menyertakan gradlew/gradle-wrapper.jar biner,
      # jadi setup-gradle di bawah otomatis men-download & memakai Gradle
      # tanpa butuh wrapper. Kalau kamu SUDAH menambahkan gradlew ke repo,
      # hapus blok "Setup Gradle" ini dan ganti langkah build memakai
      # "./gradlew build" seperti pada langkah yang di-comment di bawah.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Generate Gradle wrapper (jika belum ada)
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version latest
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build mod
        run: ./gradlew build --stacktrace

      - name: Run available checks
        run: ./gradlew check --stacktrace
        continue-on-error: true

      - name: Upload built jar
        uses: actions/upload-artifact@v4
        with:
          name: mipmap-stabilizer-jar
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload full build reports (kalau ada kegagalan)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            build/reports
            **/build/reports
          if-no-files-found: ignore
