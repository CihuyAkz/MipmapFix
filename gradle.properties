# ==========================================================================
# PENTING: 1.21.11 dirilis setelah batas pengetahuan model ini.
# Angka versi di bawah adalah nilai yang TERVERIFIKASI lewat pencarian web
# saat file ini dibuat, tapi Fabric merilis build baru cukup sering.
# SEBELUM build pertama, cek versi terbaru di:
#   - https://fabricmc.net/develop/ (Loader, Loom, Yarn)
#   - https://modrinth.com/mod/fabric-api/versions?g=1.21.11
# dan ganti nilai di bawah jika ada yang lebih baru.
# ==========================================================================

# Minecraft version
minecraft_version=1.21.11

# Yarn mappings build (terverifikasi ada build "1.21.11+build.3" per Des 2025;
# cek https://fabricmc.net/develop/ -> Yarn untuk build terbaru)
yarn_mappings=1.21.11+build.3

# Fabric Loader (SpectaCam changelog Apr 2026 menyatakan versi 1.21.11
# butuh Loader 0.19.2+)
loader_version=0.19.2

# Fabric API (build resmi 0.140.0+1.21.11, dipublikasi 17 Des 2025)
fabric_version=0.140.0+1.21.11

# Fabric Loom plugin version - cek versi terbaru di
# https://github.com/FabricMC/fabric-loom/releases sebelum build
loom_version=1.9-SNAPSHOT

# Mod properties
mod_version=1.0.0
maven_group=com.example
archives_base_name=mipmap-stabilizer

# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
